{% extends 'base.html' %}{% block title %}Review proposal — Workio{% endblock %}{% block content %}<div class="container narrow page"><div class="eyebrow">CLIENT DECISION</div><h1>Review proposal</h1><div class="review-summary"><span class="pill">{{ proposal.get_pricing_unit_display }}</span><h2>{{ proposal.title }}</h2><p>{{ proposal.scope }}</p><strong>${{ proposal.amount }}</strong></div><form method="post" class="form panel form-page review-decision">{% csrf_token %}{{ form.as_p }}<button class="button">Send decision</button><a class="button secondary" href="{% url 'proposal_detail' project.pk proposal.pk %}">Cancel</a></form></div>{% endblock %}
